# Configuracoes do auth-service, centralizadas no Config Server.
# Este arquivo e' lido pelo config-server a partir do repositorio Git
# e servido ao auth-service quando ele sobe (spring.config.import=configserver:...).

server.port=8084

server.error.include-message=always

jwt.secret=00d23b30-8bd5-4cfa-935c-9305be24d5f7

# Validade dos tokens em milissegundos: access 15 min, refresh 7 dias
jwt.access-token.expiracao-ms=900000
jwt.refresh-token.expiracao-ms=604800000

# H2 em memoria
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do H2, acessivel em http://localhost:8084/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Registro no Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
